<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Resume Chat</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Resume AI</h2>

            <button class="new-chat" onclick="newChat()">
                + New Chat
            </button>

            <div class="sidebar-info">
                <p>Ask anything about</p>
                <strong>Gourav Bhatia</strong>
            </div>
        </aside>


        <!-- Main Chat -->
        <main class="chat-container">

            <header class="chat-header">
                <h1>Ask About GOURAV BHATIA</h1>
                <p>AI assistant powered by Gourav's resume</p>
            </header>


            <!-- Messages appear here -->
            <section id="chatBox" class="chat-box">

                <div class="welcome">
                    <h2>How can I help you?</h2>
                    <p>Ask HR-related questions about my skills, projects, education or experience.</p>
                </div>

            </section>


            <!-- Input -->
            <div class="input-area">

                <div class="input-box">
                    <input
                        type="text"
                        id="question"
                        placeholder="Ask something about Gourav..."
                        onkeydown="handleEnter(event)"
                    >

                    <button onclick="sendMessage()" id="sendButton">
                        ↑
                    </button>
                </div>

                <p class="disclaimer">
                    Answers are based only on the candidate's resume.
                </p>

            </div>

        </main>

    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
